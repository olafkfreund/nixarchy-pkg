name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      # shellcheck, the manifest schema, the no-hex-colour rule, the
      # no-text-multiplier rule (#38) and qmllint (#44).
      - run: nix flake check --print-build-logs

      - run: nix build .#default --print-build-logs

      # The catalogue sections skip here -- they build from /etc/nixarchy,
      # which only a nixarchy machine has -- but the flake, search, apply,
      # draft/reindex, file-mode and source-shape sections build their own
      # fixtures or stub the writer, so they run. Before #44 the adapter had
      # no protection at all on a pull request.
      - run: bash tests/adapter.sh

      # The plugin has to survive the shell's own validator, and the rule
      # that bites is that no symlink may appear inside the folder -- which
      # is exactly what a careless derivation produces.
      - name: no symlinks in the built plugin
        run: |
          if find ./result/ -type l | grep -q .; then
            echo "symlinks in the output; omarchy-plugin-validate refuses them" >&2
            find ./result/ -type l >&2
            exit 1
          fi

      # The plugin validator checks the manifest's entry points and nothing
      # else, so a mark that failed to ship would pass every other gate and
      # draw an empty widget on someone's bar.
      - name: the bar mark ships
        run: test -f ./result/assets/package.svg

      - name: every entry point the manifest names exists
        run: |
          for f in $(nix run nixpkgs#jq -- -r '.entryPoints[]' manifest.json); do
            test -f "./result/$f" || { echo "missing entry point: $f" >&2; exit 1; }
          done
